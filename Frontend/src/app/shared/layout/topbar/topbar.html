<header
  class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-slate-200 bg-white/90 px-4 backdrop-blur md:px-6">

  <!-- Izquierda -->
  <div class="flex items-center gap-4">

    <!-- Menú móvil -->
    <button
      (click)="layout.toggleSidebar()"
      class="rounded-lg p-2 transition hover:bg-slate-100 lg:hidden">

      ☰

    </button>

    <div>

      <h2 class="text-xl font-semibold text-slate-800">

        {{ greeting }}, <strong>{{ user()?.name }}</strong>

      </h2>

      <p class="text-sm text-slate-500">

        ¿Qué aprenderemos hoy?

      </p>

    </div>

  </div>

  <!-- Derecha -->
  <div class="flex items-center gap-4">

    <!-- Buscador -->
    <div class="hidden md:block">

      <input
        type="text"
        placeholder="Buscar..."
        class="w-64 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">

    </div>

    <!-- Notificaciones -->
    <button
      class="rounded-full p-2 transition hover:bg-slate-100">

      🔔

    </button>

    <!-- Avatar -->
    <div
      class="flex h-10 w-10 items-center justify-center rounded-full bg-indigo-600 font-semibold text-white">

      M

    </div>

  </div>

</header>
