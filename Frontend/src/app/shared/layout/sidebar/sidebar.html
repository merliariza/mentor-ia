<!-- Fondo oscuro móvil -->
@if(layout.sidebarOpen()){

<div
  class="fixed inset-0 z-40 bg-black/50 lg:hidden"
  (click)="close()">
</div>

}

<!-- Sidebar -->
<aside

  class="fixed left-0 top-0 z-50 flex h-screen w-72
         -translate-x-full flex-col border-r border-slate-800
         bg-slate-900 text-slate-100 shadow-2xl transition-transform duration-300
         lg:static lg:translate-x-0"

  [class.translate-x-0]="layout.sidebarOpen()">

  <!-- Logo -->

  <div class="border-b border-slate-800 p-6">

    <h1 class="text-2xl font-bold">

      Mentor-IA

    </h1>

    <p class="mt-1 text-sm text-slate-400">

      AI Learning Assistant

    </p>

  </div>

  <!-- Nuevo chat -->

  <div class="p-4">

    <button

      routerLink="/chat"

      (click)="close()"

      class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-medium transition hover:bg-indigo-500">

      + Nuevo chat

    </button>

  </div>

  <!-- Navegación -->

  <nav class="flex-1 space-y-2 px-4">

    @for(item of navigation; track item.route){

    <a

      [routerLink]="item.route"

      routerLinkActive="bg-indigo-600 text-white shadow"

      (click)="close()"

      class="flex items-center rounded-xl px-4 py-3 text-slate-300 transition duration-200 hover:bg-slate-800 hover:text-white">

      {{item.label}}

    </a>

    }

  </nav>

  <!-- Usuario -->

  <div class="border-t border-slate-800 p-4">

    <div class="flex items-center gap-3">

      <div

        class="flex h-11 w-11 items-center justify-center rounded-full bg-indigo-600 font-semibold">

        M

      </div>

      <div>

        <p class="font-medium">

          Merli

        </p>

        <span class="text-sm text-slate-400">

          Student

        </span>

      </div>

    </div>

  </div>

</aside>
