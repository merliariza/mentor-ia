<div class="chat-input">

  <textarea
    [(ngModel)]="message"
    placeholder="¿Qué deseas aprender hoy?">
  </textarea>


 <button class="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-3 font-semibold text-white shadow-md shadow-indigo-200 transition-all duration-200 hover:-translate-y-0.5 hover:from-indigo-700 hover:to-violet-700 hover:shadow-lg disabled:cursor-not-allowed disabled:opacity-50"
    (click)="sendMessage()">
  Enviar
</button>

</div>
